name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for tagging

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true
        packages: platform-tools

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate version name
      id: version
      run: |
        # Use date + GitHub run number for unique version
        DATE=$(date -u +"%Y.%m.%d")
        RUN_NUM=${{ github.run_number }}
        VERSION="1.0.${DATE}-${RUN_NUM}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: Update versionName in build.gradle.kts
      run: |
        sed -i "s/versionName = \".*\"/versionName = \"${{ steps.version.outputs.version }}\"/" app/build.gradle.kts
        sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
        cat app/build.gradle.kts | grep -E "versionCode|versionName"

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Create Git tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-${{ steps.version.outputs.version }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Pocket Option Helper ${{ steps.version.outputs.version }}
        body: |
          ## Pocket Option Helper ${{ steps.version.outputs.version }}

          **Build date:** $(date -u +"%Y-%m-%d %H:%M UTC")
          **GitHub Run:** #${{ github.run_number }}
          **Commit:** ${{ github.sha }}

          ### Changes
          ${{ github.event.head_commit.message || 'Manual build' }}

          ### Download
          - [app-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/app-debug.apk)
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}